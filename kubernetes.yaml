apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reliability-api
  template:
    metadata:
      labels:
        app: reliability-api
    spec:
      containers:
        - name: api
          image: reliability-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: reliability-api
spec:
  selector:
    app: reliability-api
  ports:
    - port: 8080
      targetPort: 8080